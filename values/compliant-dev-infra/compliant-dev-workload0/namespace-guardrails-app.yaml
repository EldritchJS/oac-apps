# compliant-dev-workload0's own namespaces; the shared ones are in
# hosted-clusters/namespace-guardrails.yaml.
_quota: &smallQuota
  pods: '10'
  services: '5'
  persistentvolumeclaims: '2'
  requests.storage: 20Gi
  services.nodeports: '0'
  services.loadbalancers: '0'

namespaces:
  compliant-dev-workload0:
    ingress: {}
    egress: {}
    quota: *smallQuota
  open-cluster-management-compliant-dev-workload0:
    ingress: {}
    egress: {}
    quota: *smallQuota
  # As on the hub: the operator's webhook on 9443, which the API server
  # reaches through the konnectivity agent on the host network.
  patch-operator:
    ingress:
      hostNetworkPorts: [9443]
    egress:
      apiAndDns: true
    quota:
      pods: '10'
      persistentvolumeclaims: '2'
      requests.storage: 20Gi
      services: '10'
      services.nodeports: '0'
      services.loadbalancers: '0'
  # HyperShift runs the NodePool's in-place upgrade pods in
  # compliant-dev-workload0-hypervisor-upgrade during a rollout, and the
  # namespace exists only then. Not listed until one has run: a policy
  # for a missing namespace fails the whole sync. On nist-dev-workload0
  # (NodePool "compute") it took ingress {} and smallQuota.
