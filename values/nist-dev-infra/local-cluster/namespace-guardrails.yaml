# nist-dev-infra (test hub). Only the namespaces the compliance charts
# create. Namespaces owned by the standard hub components (portworx, acm,
# and the rest) are left alone until their traffic has been measured here.
# Rules taken from jetty (compliance/manifests/17-*, 18-*, 22-* in
# EldritchJS/oac-eldritch-things).
namespaces:
  etcd-backup:
    ingress: {}
    egress: {}
    quota:
      pods: '4'
      persistentvolumeclaims: '2'
      requests.storage: 50Gi
      services: '0'
      services.nodeports: '0'
      services.loadbalancers: '0'
  rhacs-operator:
    ingress:
      monitoringPorts:
      - 8443
    egress:
      apiAndDns: true
  stackrox:
    egress:
      apiAndDns: true
      sameNamespace: true
    extraPolicies:
    - name: allow-egress-https-feeds
      spec:
        podSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - central
            - scanner-v4-indexer
        policyTypes:
        - Egress
        egress:
        - ports:
          - protocol: TCP
            port: 443
    quota:
      pods: '45'
      persistentvolumeclaims: '8'
      requests.storage: 1Ti
      services: '20'
      services.nodeports: '0'
      services.loadbalancers: '0'
