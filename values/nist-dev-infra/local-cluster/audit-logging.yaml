# The bucket comes from the hub's COSI driver. Loki reaches it through the
# object storage proxy, at s3.nist-dev-infra.nist.int.massopen.cloud, whose
# Let's Encrypt certificate needs no CA here.
forwarder:
  hostedControlPlanes: true
loki:
  # Test hub: the FlashBlade over NFS, the hub's only class.
  storageClassName: pure-fb-nfsv4
# Hosted clusters that forward their node audit logs here
# (hosted-clusters/audit-logging.yaml).
auditWriters:
  clusters:
    - nist-dev-workload0
