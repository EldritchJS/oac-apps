# The bucket comes from the hub's COSI driver. Loki reaches it through the
# object storage proxy, at s3.nist-dev-infra.nist.int.massopen.cloud, whose
# Let's Encrypt certificate needs no CA here.
forwarder:
  hostedControlPlanes: true
loki:
  # Test hub: the FlashBlade over NFS, the hub's only class.
  storageClassName: pure-fb-nfsv4
  # The hosted API servers' audit lands in the application tenant. With
  # the WriteRequestBodies profile some lines are whole ConfigMaps (the
  # compliance scans' results, up to 784 kB on 2026-10-23), past the
  # default 256 kB line limit, and the tenant's rate limit refused about
  # half of what the collector sent, retries included, though the API
  # servers write about 50 kB/s.
  tenantLimits:
    application:
      ingestion:
        ingestionRate: 16
        ingestionBurstSize: 32
        maxLineSize: 2097152
# Hosted clusters that forward their node audit logs here
# (hosted-clusters/audit-logging.yaml).
auditWriters:
  clusters:
    - nist-dev-workload0
