# nist-dev-infra (test hub). Stage C only: syncing this reboots every node.
# On a compact hub that is the whole cluster, one node at a time. Pause the
# master pool first.
#
# The chart's defaults are right for the hub itself. NodePool delivery
# (nodePool.enabled) stays off until there is a hosted cluster: its
# ConfigMap goes in the `clusters` namespace, which does not exist yet.
nodePool:
  enabled: false
