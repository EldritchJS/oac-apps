# nist-dev-infra (test hub). Stage C only: syncing this reboots every node.
# On a compact hub that is the whole cluster, one node at a time. Pause the
# master pool first.
#
# The chart's defaults are right for the hub itself. NodePool delivery puts
# its ConfigMap in the `clusters` namespace, which hub-hcp-config creates;
# every hosted cluster's NodePools reference it.
nodePool:
  enabled: true
