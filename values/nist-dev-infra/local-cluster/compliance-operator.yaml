# nist-dev-infra (test hub). Stage A ran the scanner alone, with no
# tailoring, to measure a fresh FIPS install before anything was hardened.
#
# Compact hub: all three nodes are masters, and the worker pool is empty.
# Scanning the worker role as well would scan the same nodes twice.
scanSetting:
  roles: [master]
  # The hub has no StorageClass yet: Portworx is not configured for it.
  # Results are still kept as ComplianceCheckResult objects; only the raw
  # ARF files (evidence archive) are skipped. Turn this back on, with the
  # class, once storage exists.
  rawResultStorage:
    enabled: false

# The only tailoring: two scanner false positives, one as on jetty; the
# ingress CA rule, which a publicly issued certificate cannot satisfy
# (ingressCert below); and the namespaces whose workloads an operator
# owns, exempted from the requests-and-limits rules (vendorLimits below).
# Every other failure is fixed or recorded as a gap, not tailored away.
_rationale:
  vendorLimits: &vendorLimits "Every Deployment, DaemonSet and StatefulSet without requests or limits in these namespaces belongs to an operator that owns its spec and would revert an edit (listed on nist-dev-infra 2026-10-24): ACM and its hub, agent and observability (MultiClusterHub, ClusterManager, Klusterlet, MultiClusterObservability), multicluster-engine with HyperShift, Hive and the agent install service, and HyperShift's hosted control planes (clusters-*, which set requests but not limits by design); cert-manager, External Secrets, external-dns, MetalLB, Portworx and patch-operator (OLM operators). Each namespace has a ResourceQuota (namespace-guardrails), which bounds what it can use. The rules stay on for every other namespace. pure-cosi-driver, in portworx, gets requests and limits from oac-apps (kustomize/pure-cosi)."
  ingressCert: &ingressCert "The rule takes a trusted CA bundle in proxy/cluster (spec.trustedCA) as the sign that the default ingress certificate was replaced. The hub replaces it with a Let's Encrypt wildcard certificate (cluster-certificates, cert-manager DNS-01, oac-apps #184), which chains to a public root already in the system trust, so no custom bundle is needed. Setting one only to satisfy the rule would restart every operator that consumes the trusted bundle. Checked on nist-dev-infra (2026-10-26): the IngressController's default certificate is that Certificate, and the router serves it (issuer Let's Encrypt YR2, *.apps.nist-dev-infra.nist.int.massopen.cloud). ingress-controller-certificate passes."
  vendorRegex: &vendorRegex "^(cert-manager|cert-manager-operator|clusters-.*|external-dns-operator|external-secrets|hive|hypershift|klusterlet-.*|metallb-system|multicluster-engine|open-cluster-management|open-cluster-management-agent|open-cluster-management-agent-addon|open-cluster-management-hub|open-cluster-management-observability|patch-operator|portworx)$"

tailoredProfiles:
  - name: nist-ocp4-cis
    spec:
      extends: ocp4-cis
      title: CIS (nist-dev-infra)
      description: Stock ocp4-cis without one false positive (OCPBUGS-126610).
      disableRules:
        - name: ocp4-openshift-api-server-audit-log-path
          rationale: "Scanner false positive, OCPBUGS-126610: the content checks the kube-apiserver ConfigMap for the openshift-apiserver path. The real openshift-apiserver audit-log-path is set (/var/log/openshift-apiserver/audit.log, checked 2026-10-19) and is verified directly by tests/verify.sh T-03. Re-enable when fixed content ships."
  - name: nist-ocp4-moderate
    spec:
      extends: ocp4-moderate
      title: NIST 800-53 Moderate (nist-dev-infra)
      description: Stock ocp4-moderate without two false positives (OCPBUGS-126610; a lokiStack output has no url) and the ingress CA rule, which a public certificate cannot satisfy.
      disableRules:
        - name: ocp4-openshift-api-server-audit-log-path
          rationale: "Scanner false positive, OCPBUGS-126610: the content checks the kube-apiserver ConfigMap for the openshift-apiserver path. The real openshift-apiserver audit-log-path is set (/var/log/openshift-apiserver/audit.log, checked 2026-10-19) and is verified directly by tests/verify.sh T-03. Re-enable when fixed content ships."
        - name: ocp4-audit-log-forwarding-uses-tls
          rationale: "Scanner false positive: the rule lists the url of each ClusterLogForwarder output and fails when none is https or tls. The hub's only output (openshift-logging/audit) is of type lokiStack, which has no url field: it sends to the LokiStack gateway in the cluster over https, verifying the gateway with the service CA (checked 2026-10-23). audit-log-forwarding-enabled passes."
        - name: ocp4-default-ingress-ca-replaced
          rationale: *ingressCert
      setValues:
        - name: ocp4-var-deployment-limit-namespaces-exempt-regex
          value: *vendorRegex
          rationale: *vendorLimits
        - name: ocp4-var-daemonset-limit-namespaces-exempt-regex
          value: *vendorRegex
          rationale: *vendorLimits
        - name: ocp4-var-statefulset-limit-namespaces-exempt-regex
          value: *vendorRegex
          rationale: *vendorLimits

bindings:
  - name: cis-baseline
    profiles:
      - name: nist-ocp4-cis
        kind: TailoredProfile
      - name: ocp4-cis-node
  - name: nist-moderate
    profiles:
      - name: nist-ocp4-moderate
        kind: TailoredProfile
      - name: ocp4-moderate-node
      - name: rhcos4-moderate
