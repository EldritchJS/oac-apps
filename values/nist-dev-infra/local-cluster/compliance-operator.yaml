# nist-dev-infra (test hub). Stage A ran the scanner alone, with no
# tailoring, to measure a fresh FIPS install before anything was hardened.
#
# Compact hub: all three nodes are masters, and the worker pool is empty.
# Scanning the worker role as well would scan the same nodes twice.
scanSetting:
  roles: [master]
  # The hub has no StorageClass yet: Portworx is not configured for it.
  # Results are still kept as ComplianceCheckResult objects; only the raw
  # ARF files (evidence archive) are skipped. Turn this back on, with the
  # class, once storage exists.
  rawResultStorage:
    enabled: false

# The only tailoring: one scanner false positive, as on jetty. Every
# other failure is fixed or recorded as a gap, not tailored away.
tailoredProfiles:
  - name: nist-ocp4-cis
    spec:
      extends: ocp4-cis
      title: CIS (nist-dev-infra)
      description: Stock ocp4-cis without one false positive (OCPBUGS-126610).
      disableRules:
        - name: ocp4-openshift-api-server-audit-log-path
          rationale: "Scanner false positive, OCPBUGS-126610: the content checks the kube-apiserver ConfigMap for the openshift-apiserver path. The real openshift-apiserver audit-log-path is set (/var/log/openshift-apiserver/audit.log, checked 2026-10-19) and is verified directly by tests/verify.sh T-03. Re-enable when fixed content ships."
  - name: nist-ocp4-moderate
    spec:
      extends: ocp4-moderate
      title: NIST 800-53 Moderate (nist-dev-infra)
      description: Stock ocp4-moderate without one false positive (OCPBUGS-126610).
      disableRules:
        - name: ocp4-openshift-api-server-audit-log-path
          rationale: "Scanner false positive, OCPBUGS-126610: the content checks the kube-apiserver ConfigMap for the openshift-apiserver path. The real openshift-apiserver audit-log-path is set (/var/log/openshift-apiserver/audit.log, checked 2026-10-19) and is verified directly by tests/verify.sh T-03. Re-enable when fixed content ships."

bindings:
  - name: cis-baseline
    profiles:
      - name: nist-ocp4-cis
        kind: TailoredProfile
      - name: ocp4-cis-node
  - name: nist-moderate
    profiles:
      - name: nist-ocp4-moderate
        kind: TailoredProfile
      - name: ocp4-moderate-node
      - name: rhcos4-moderate
