apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.logging.namespace }}
  labels:
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.logging.namespace }}
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.logging.subscription.name }}
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- with .Values.logging.subscription }}
  channel: {{ .channel }}
  name: {{ .name }}
  source: {{ .source }}
  sourceNamespace: {{ .sourceNamespace }}
  installPlanApproval: {{ .installPlanApproval }}
  {{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.loki.namespace }}
  labels:
    openshift.io/cluster-monitoring: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
# The Loki operator watches all namespaces.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.loki.namespace }}
  namespace: {{ .Values.loki.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.loki.subscription.name }}
  namespace: {{ .Values.loki.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  {{- with .Values.loki.subscription }}
  channel: {{ .channel }}
  name: {{ .name }}
  source: {{ .source }}
  sourceNamespace: {{ .sourceNamespace }}
  installPlanApproval: {{ .installPlanApproval }}
  {{- end }}
