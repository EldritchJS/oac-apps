# A bucket on the cluster's object storage (COSI), and Loki's S3 secret
# built from the credentials COSI writes, as acm-observability does.
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: {{ .Values.loki.name }}
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  bucketClassName: {{ .Values.loki.storage.bucketClassName }}
  protocols:
    - S3
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: {{ .Values.loki.name }}
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  bucketAccessClassName: {{ .Values.loki.storage.bucketAccessClassName }}
  bucketClaimName: {{ .Values.loki.name }}
  credentialsSecretName: bucketclaim-{{ .Values.loki.name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-secret-reader
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-secret-reader
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-secret-reader
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-secret-reader
subjects:
  - kind: ServiceAccount
    name: external-secrets-secret-reader
    namespace: {{ .Values.logging.namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: bucketconverter
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    kubernetes:
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-secret-reader
      remoteNamespace: {{ .Values.logging.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.loki.storage.secretName }}
  namespace: {{ .Values.logging.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Short, so the secret appears soon after COSI grants access.
  refreshInterval: 10m
  secretStoreRef:
    name: bucketconverter
    kind: SecretStore
  target:
    name: {{ .Values.loki.storage.secretName }}
    template:
      data:
        bucketnames: {{ "{{ (.bucketInfo | fromJson).spec.bucketName }}" | quote }}
        endpoint: {{ "https://{{ (.bucketInfo | fromJson).spec.secretS3.endpoint }}" | quote }}
        access_key_id: {{ "{{ (.bucketInfo | fromJson).spec.secretS3.accessKeyID }}" | quote }}
        access_key_secret: {{ "{{ (.bucketInfo | fromJson).spec.secretS3.accessSecretKey }}" | quote }}
        # The FlashBlade serves buckets by path, not by host name.
        forcepathstyle: "true"
  data:
    - secretKey: bucketInfo
      remoteRef:
        key: bucketclaim-{{ .Values.loki.name }}
        property: BucketInfo
