suite: cluster-admins chart

tests:
  - it: should render nothing by default
    templates:
      - templates/clusterrolebindings.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should bind cluster-admin to each group
    set:
      groups:
        - first-admins
        - second-admins
    templates:
      - templates/clusterrolebindings.yaml
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: first-admins-cluster-admin
        documentIndex: 0
      - equal:
          path: roleRef.name
          value: cluster-admin
        documentIndex: 0
      - equal:
          path: subjects[0]
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Group
            name: second-admins
        documentIndex: 1
