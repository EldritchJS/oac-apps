{{- if .Values.imageConfig.enabled }}
# A cluster singleton: server-side apply so only these fields are owned,
# and never pruned.
apiVersion: config.openshift.io/v1
kind: Image
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
spec:
  registrySources:
    allowedRegistries:
      {{- required "imageConfig.allowedRegistries is required" .Values.imageConfig.allowedRegistries | toYaml | nindent 6 }}
  {{- with .Values.imageConfig.allowedRegistriesForImport }}
  allowedRegistriesForImport:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
