# Test cluster for GPU VMs (MOC-issues #788): one worker VM with four H100s,
# on compliant-dev-workload0, the hub's GPU hypervisor. It replaces the
# andalusia that ran on jetty from oac-dev-infra; a HostedCluster cannot
# change hubs, so this is a new cluster with the old name. Same layout as
# oac-dev-workload2 on oac-dev-workload1.
clusterName: andalusia

platform:
  type: KubeVirt
  kubevirt:
    # Written by the hypervisor-cluster chart on compliant-dev-workload0
    # (values/compliant-dev-infra/compliant-dev-workload0/hypervisor-cluster.yaml).
    infraKubeConfigSecretName: compliant-dev-workload0-kubeconfig

oauth:
  mocsso:
    enabled: false   # TODO: a moc-keycloak client, if andalusia gets users

services:
  APIServer:
    # Pinned internal LoadBalancer IP from the hub's MetalLB pool. Without
    # it the worker VM's API hostname falls through to the hub router's
    # wildcard, which does not serve :6443, and no node ever joins.
    ipAddress: 10.20.19.14

dns:
  enabled: true
  autoGenerate: true

release:
  channel: stable-4.22
  image: quay.io/openshift-release-dev/ocp-release:4.22.18-multi

# machineNetwork is compliant-dev-workload0's pod network (the chart
# default), where the worker VM lives. The cluster and service networks
# must not overlap the hypervisor's.
networking:
  clusterNetwork:
    - cidr: 10.140.0.0/14
  machineNetwork:
    - cidr: 10.132.0.0/14
  serviceNetwork:
    - cidr: 172.33.0.0/16

# Hosted etcd uses the hub's default, lvms-vg0 (hosted-clusters/
# compliant-dev-infra/values.yaml). The VM's disk is on the hypervisor's
# FlashBlade class, NFS with TLS (portworx.tls).
nodePools:
  - name: gpu
    replicas: 1
    cpu: 64
    memory: 128Gi   # as in the GPU VM benchmarks, with a 300Gi disk
    disk:
      size: 300Gi
      storageClass: pure-fb-nfsv4
    nodeSelector:
      kubernetes.io/hostname: TODO   # one SD665's node name on compliant-dev-workload0
    hostDevices:
      - deviceName: nvidia.com/GH100_H100_SXM5_80GB
        count: 4
    qosClass: Guaranteed
    # The replacement VM can't start while the old one holds the GPUs.
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    # One node: the drain can't finish, so stop waiting after 10 minutes.
    nodeDrainTimeout: 10m
